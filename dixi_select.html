<!DOCTYPE html>
<html>

<head>

    <title>Welches Dixi möchtest du bewerten?</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>
        body {

            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;

        }


        input {

            font-size: 22px;
            width: 100px;
            text-align: center;
            padding: 10px;

        }


        button {

            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #00cc66;

        }
    </style>


</head>


<body>


    <h1>Dixi Nummer wählen</h1>



    <input id="dixiInput" type="number" min="1" placeholder="Nr.">


    <br>


    <button onclick="Idselection()">
        Bewerten
    </button>



    <script>


        const supabaseUrl =
            "https://eoynzcvblbelxytzpzwx.supabase.co";


        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVveW56Y3ZibGJlbHh5dHpwend4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNTkyNTAsImV4cCI6MjA5NzYzNTI1MH0.XADi4nRE1FH4O-Nwkhfb4a6_HnAcmRPjk9x8SnO_TpY";;

        const { createClient } = supabase;


        const client = createClient(
            supabaseUrl,
            supabaseKey
        );



        async function Idselection() {


            const dixiId =
                Number(
                    document.getElementById("dixiInput").value
                );


            if (!dixiId) {

                alert("Bitte Dixi Nummer eingeben");

                return;

            }


            const { data: dixi, error } = await client
                .from("dixies")
                .select("*")
                .eq("id", dixiId)
                .eq("active", true)
                .single();



            if (error || !dixi) {

                alert(
                    "Dieses Dixi existiert nicht."
                );

                return;

            }


            window.location.href =
                "index.html?dixi=" + dixiId;


        }



    </script>


</body>

</html>
